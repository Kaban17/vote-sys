<!doctype html>
<!--
  Админка: создание опроса и просмотр агрегатов. Cold path, нагрузка
  пренебрежима (architecture.md §3).

  В отличие от публичного лендинга, здесь результаты видны и во время
  голосования: методологическое ограничение на показ промежуточных цифр
  относится к зрителям, а не к оператору.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка опросов</title>
  <style>
    :root {
      --bg: #f6f7f9; --fg: #16181d; --muted: #6b7280;
      --card: #fff; --line: #e3e6ea; --accent: #2563eb; --accent-fg: #fff;
      --bar: #93c5fd; --ok: #15803d; --err: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --fg: #e6e8ec; --muted: #9aa1ad;
        --card: #171a20; --line: #262b33; --accent: #3b82f6; --accent-fg: #fff;
        --bar: #1d4ed8; --ok: #4ade80; --err: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
    }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px; margin-bottom: 14px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; font: inherit; color: inherit;
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    }
    button {
      padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer;
      background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px;
    }
    button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1 1 160px; }
    details.poll { border-top: 1px solid var(--line); }
    details.poll:first-child { border-top: 0; }
    details.poll > summary {
      padding: 12px 0; cursor: pointer; list-style: none;
      display: flex; gap: 12px; align-items: flex-start;
    }
    details.poll > summary::-webkit-details-marker { display: none; }
    /* Треугольник рисуем сами: у нативного маркера нет управления цветом,
       и он по-разному выглядит в браузерах. */
    details.poll > summary::before {
      content: "▸"; color: var(--muted); flex: 0 0 auto;
      transition: transform .12s ease; line-height: 1.6;
    }
    details.poll[open] > summary::before { transform: rotate(90deg); }
    details.poll > summary:hover { color: var(--accent); }
    .poll-body { padding: 4px 0 16px 20px; }
    .poll-title { flex: 1 1 auto; }
    .meta { color: var(--muted); font-size: 13px; }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 12px; border: 1px solid var(--line);
    }
    .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 5px; }
    .bar > i { display: block; height: 100%; background: var(--bar); }
    .opt { margin-bottom: 12px; }
    .opt .top { display: flex; justify-content: space-between; gap: 12px; }
    .mono { font-variant-numeric: tabular-nums; }
    .err { color: var(--err); }
    .ok { color: var(--ok); }
    .hidden { display: none; }
    code { font-size: 12px; color: var(--muted); word-break: break-all; }
  </style>
</head>
<body>
<main>
  <h1>Админка опросов</h1>

  <div class="card">
    <div class="row">
      <div style="flex: 3 1 260px">
        <label for="token">Админский токен</label>
        <input id="token" type="password" placeholder="ADMIN_BEARER_TOKEN" autocomplete="off">
      </div>
      <div style="flex: 0 0 auto">
        <button id="save" type="button">Сохранить</button>
      </div>
    </div>
    <div id="auth" class="meta"></div>
  </div>

  <div class="card">
    <h2>Создать опрос</h2>
    <form id="create">
      <label for="q">Вопрос</label>
      <input id="q" required value="Какой вариант вы поддерживаете?">
      <label for="opts">Варианты, по одному в строке</label>
      <textarea id="opts" rows="3" required>Вариант A
Вариант B
Вариант C</textarea>
      <div class="row">
        <div>
          <label for="kind">Тип</label>
          <select id="kind">
            <option value="single">single — один вариант</option>
            <option value="multiple">multiple — несколько</option>
          </select>
        </div>
        <div>
          <label for="max">max_choices (только multiple)</label>
          <input id="max" type="number" min="0" value="0">
        </div>
        <div>
          <label for="dur">Длительность, секунд</label>
          <input id="dur" type="number" min="5" value="60">
        </div>
        <div style="flex: 0 0 auto">
          <button type="submit">Создать</button>
        </div>
      </div>
    </form>
    <div id="created" class="meta"></div>
  </div>

  <div class="card">
    <h2>Опросы</h2>
    <div id="list" class="meta">—</div>
  </div>

</main>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var token = localStorage.getItem("admin_token") || "";
  $("token").value = token;

  // Раскрытые опросы. Хранятся отдельно от DOM, чтобы обновление списка не
  // схлопывало то, что оператор сейчас читает.
  var expanded = new Set();
  // id → узлы строки. Список обновляется НА МЕСТЕ: перерисовка целиком
  // заставляла бы открытый блок мигать раз в секунду.
  var rows = new Map();

  function auth() { return { "Authorization": "Bearer " + token }; }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, auth());
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) throw new Error("Неверный админский токен");
      return r.json().then(function (body) {
        if (!r.ok) throw new Error(body.message || ("Ошибка " + r.status));
        return body;
      });
    });
  }

  $("save").addEventListener("click", function () {
    token = $("token").value.trim();
    localStorage.setItem("admin_token", token);
    load();
  });

  $("create").addEventListener("submit", function (e) {
    e.preventDefault();
    var opts = $("opts").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    var dur = parseInt($("dur").value, 10) || 60;
    var kind = $("kind").value;
    var max = parseInt($("max").value, 10) || 0;

    // starts_at на пять секунд в прошлое: опрос открыт сразу, его можно
    // потрогать, не гоняясь за секундомером.
    var now = Date.now();
    var body = {
      question: $("q").value,
      kind: kind,
      starts_at: new Date(now - 5000).toISOString(),
      ends_at: new Date(now + dur * 1000).toISOString(),
      options: opts
    };
    if (kind === "multiple" && max > 0) body.max_choices = max;

    api("/api/admin/polls", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (p) {
      $("created").innerHTML = '<span class="ok">Создан.</span> Ссылка для зрителя: ' +
        '<a href="/p/' + p.id + '" target="_blank">/p/' + p.id + '</a>';
      expanded.add(p.id); // созданный опрос сразу раскрыт: за ним и будут смотреть
      load();
    }).catch(function (e) {
      $("created").innerHTML = '<span class="err">' + escapeHtml(e.message) + "</span>";
    });
  });

  function load() {
    if (!token) { $("auth").innerHTML = '<span class="err">Укажите токен</span>'; return; }
    // Ограничение осмысленное, а не косметическое: опросов накапливается много,
    // а оператору нужны последние — список отсортирован по created_at DESC.
    api("/api/admin/polls?limit=20").then(function (data) {
      $("auth").innerHTML = '<span class="ok">Токен принят</span>';
      sync(data.polls || []);
    }).catch(function (e) {
      $("auth").innerHTML = '<span class="err">' + escapeHtml(e.message) + "</span>";
    });
  }

  // sync приводит список в соответствие с ответом, не трогая уже отрисованное:
  // существующие строки обновляются, исчезнувшие удаляются, новые добавляются.
  function sync(polls) {
    if (!polls.length) {
      $("list").textContent = "Опросов пока нет";
      rows.clear();
      return;
    }
    if (rows.size === 0) $("list").innerHTML = "";

    var seen = new Set();
    polls.forEach(function (p) {
      seen.add(p.id);
      var row = rows.get(p.id);
      if (!row) {
        row = buildRow(p);
        rows.set(p.id, row);
        $("list").appendChild(row.details);
      }
      row.meta.innerHTML = metaHTML(p);
    });

    rows.forEach(function (row, id) {
      if (!seen.has(id)) {
        row.details.remove();
        rows.delete(id);
        expanded.delete(id);
      }
    });
  }

  function metaHTML(p) {
    return '<span class="badge">' + p.state + "</span> " + p.kind +
      " · до " + new Date(p.ends_at).toLocaleTimeString() +
      " · gen " + p.generation +
      '<br><code>' + p.id + "</code>";
  }

  function buildRow(p) {
    var details = document.createElement("details");
    details.className = "poll";
    details.open = expanded.has(p.id);

    var summary = document.createElement("summary");
    var title = document.createElement("div");
    title.className = "poll-title";

    var q = document.createElement("div");
    q.textContent = p.question;

    var meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = metaHTML(p);

    title.appendChild(q);
    title.appendChild(meta);
    summary.appendChild(title);

    var body = document.createElement("div");
    body.className = "poll-body meta";
    body.textContent = "загрузка…";

    details.appendChild(summary);
    details.appendChild(body);

    details.addEventListener("toggle", function () {
      if (details.open) {
        expanded.add(p.id);
        refreshOne(p.id, body);
      } else {
        expanded.delete(p.id);
      }
    });
    if (details.open) refreshOne(p.id, body);

    return { details: details, meta: meta, body: body };
  }

  function refreshOne(id, body) {
    api("/api/admin/polls/" + id + "/results").then(function (r) {
      body.innerHTML = "";

      r.results.forEach(function (o) {
        var el = document.createElement("div");
        el.className = "opt";
        el.innerHTML =
          '<div class="top"><span>' + escapeHtml(o.text) + "</span>" +
          '<span class="mono">' + o.votes + " · " + o.percent.toFixed(1) + "%</span></div>" +
          '<div class="bar"><i style="width:' + Math.min(100, o.percent) + '%"></i></div>';
        body.appendChild(el);
      });

      var foot = document.createElement("div");
      // Проценты считаются от числа проголосовавших, а не от суммы голосов: при
      // multiple один зритель увеличивает несколько счётчиков, и сумма
      // процентов законно превысит 100 (architecture.md §5.8).
      foot.textContent = "Проголосовало: " + r.voters +
        (r.stale_for_ms >= 0
          ? " · данные отстают на " + r.stale_for_ms + " мс"
          : " · из Postgres, снапшота нет");
      body.appendChild(foot);
    }).catch(function (e) {
      body.innerHTML = '<span class="err">' + escapeHtml(e.message) + "</span>";
    });
  }

  // Обновляются только раскрытые опросы: закрытые не стоят ни запроса.
  function refreshExpanded() {
    rows.forEach(function (row, id) {
      if (expanded.has(id)) refreshOne(id, row.body);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  load();
  setInterval(refreshExpanded, 1000);
  // Список реже: меняются только состояние и generation, а перерисовка мешает
  // читать раскрытые результаты.
  setInterval(load, 5000);
})();
</script>
</body>
</html>
