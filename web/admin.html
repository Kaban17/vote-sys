  пренебрежима (architecture.md §3).

  В отличие от публичного лендинга, здесь результаты видны и во время
  голосования: методологическое ограничение на показ промежуточных цифр
  относится к зрителям, а не к оператору.
-->

  <title>Админка опросов</title>

  </main>

  </script>

</html>
