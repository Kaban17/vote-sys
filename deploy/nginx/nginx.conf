worker_processes auto;

events {
    worker_connections 65535;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Журнал отказов ------------------------------------------------------
    # Успешные запросы не логируются: 250K RPS × строка — это дисковая нагрузка
    # поверх сетевой, ради данных, которые уже есть в агрегате приложения.
    #
    # Но отбитые лимитом запросы приложение не видит В ПРИНЦИПЕ: nginx отвечает
    # 429 сам, до проксирования. Без этой строки вопрос «не режет ли лимит живых
    # зрителей» не имеет ответа ни здесь, ни в приложении — а во время эфира это
    # один из двух вопросов, которые вообще важны.
    #
    # Адреса в формате НЕТ намеренно: пара «IP + время + опрос» на отклонённый
    # голос восстанавливает ту же связь, которой мы избегаем в базе и в логах
    # приложения (architecture.md §7).
    #
    # На проде это должна быть метрика, а не лог: при массовом отказе объём
    # снова становится проблемой. Здесь — сознательное упрощение стенда.
    log_format  rejected  '$time_iso8601 status=$status method=$request_method uri=$uri';
    map $status $is_rejected {
        ~^[23]   0;
        default  1;
    }
    access_log  off;

    sendfile    on;
    tcp_nopush  on;
    keepalive_requests 10000;

    # --- Rate limiting -------------------------------------------------------
    # Живёт здесь, а не в Redis, сознательно (architecture.md §5.3).
    # Дедуп — потолок системы; тратить на приблизительную проверку ещё 250K ops/sec
    # в том же Redis нельзя. Плата: лимит становится per-node вместо глобального,
    # то есть при K нодах фактический порог в K раз выше номинального. Для порога
    # такого масштаба несущественно — он отсекает автоматизированную накрутку,
    # а не считает точный бюджет.
    #
    # Порог намеренно щедрый: за одним публичным адресом мобильного оператора
    # (CGNAT) сидят десятки тысяч абонентов, и строгое ограничение по IP вырезало бы
    # легитимное большинство. Точный дедуп — по cookie, не по адресу.
    limit_req_zone  $binary_remote_addr  zone=vote:64m   rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=token:64m  rate=60r/m;
    limit_req_status 429;

    upstream api {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        server api3:8080 max_fails=0;
        keepalive 256;
    }

    # --- Roadmap: локальный дедуп через маршрутизацию по хешу токена ---------
    # Снимает единственный синхронный round-trip: все запросы с одним токеном
    # попадают на один инстанс, дедуп становится in-memory мапой (architecture.md §10).
    #
    # Применяется ТОЛЬКО к /vote. При отсутствии куки hash считается от пустой
    # строки, и все запросы без токена улетели бы на один инстанс — а первый заход
    # зрителя как раз без куки. Поэтому минт остаётся на round-robin.
    #
    # upstream api_by_token {
    #     hash $cookie_vote_token consistent;
    #     server api1:8080;
    #     server api2:8080;
    #     server api3:8080;
    #     keepalive 256;
    # }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Кэш для результатов после закрытия опроса (architecture.md §3).
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=results:16m max_size=256m inactive=10m;

    # --- Нагрузочный вход (только стенд) -------------------------------------
    # Тот же upstream, но без limit_req.
    #
    # Нужен потому, что лимит считается по IP, а генератор бьёт с одного адреса —
    # то есть ровно по тому шаблону, против которого лимит и поставлен. Без
    # отдельного входа замер показывал бы работу лимитера, а не сервиса.
    #
    # Порт наружу отдаёт docker-compose и только на стенде: в проде этого
    # server-блока быть не должно, иначе он станет обходом защиты.
    server {
        listen 81;

        access_log /dev/stdout rejected if=$is_rejected;

        location / {
            proxy_pass http://api;
            proxy_read_timeout 5s;
            proxy_connect_timeout 200ms;
        }
    }

    server {
        listen 80 default_server;

        access_log /dev/stdout rejected if=$is_rejected;

        # --- Лендинг: чистая статика, без Set-Cookie -------------------------
        # Кэшируемое и некэшируемое разнесены по разным URL и методам, чтобы
        # никакая конфигурация не могла их смешать (architecture.md §5.1).
        # Один закэшированный ответ с Set-Cookie раздал бы всем зрителям один
        # и тот же токен и уничтожил бы опрос целиком.
        location /p/ {
            alias /var/www/web/;
            # Фолбэк — URI внутри ЭТОЙ же локации, а не /index.html: при alias
            # внешний путь не совпадает с файловым, и /index.html ушёл бы искать
            # локацию заново, не нашёл бы её и вернул 404. Лендинг при этом молча
            # переставал отдаваться — а проверка «лендинг не ставит Set-Cookie»
            # на 404 проходит вхолостую.
            try_files $uri /p/index.html;
            # Только add_header: вместе с expires заголовок Cache-Control
            # уходил бы клиенту дважды, с разными значениями.
            add_header Cache-Control "public, max-age=3600";
        }

        # --- Админка ---------------------------------------------------------
        # Отдельной локацией и БЕЗ кэширования: страница операторская, её
        # незачем раздавать с edge, а токен доступа живёт в localStorage.
        location = /admin {
            alias /var/www/web/admin.html;
            default_type text/html;
            add_header Cache-Control "no-store";
        }

        # --- Минт токена -----------------------------------------------------
        # POST не кэшируется ни одним CDN по спецификации HTTP, а не по настройке.
        # Ошибка с раздачей общего токена становится невыразимой.
        location = /api/token {
            limit_req zone=token burst=10 nodelay;
            proxy_pass http://api;
        }

        # --- Голос: горячий путь ---------------------------------------------
        location ~ ^/api/polls/[^/]+/vote$ {
            limit_req zone=vote burst=5 nodelay;
            proxy_pass http://api;          # roadmap: http://api_by_token
            proxy_read_timeout 2s;
            proxy_connect_timeout 200ms;
        }

        # --- Результаты: two-phase кэширование --------------------------------
        # Пока опрос идёт — 425 с no-store, их отдаёт приложение.
        # После закрытия ответ одинаков для всех и уезжает в кэш целиком.
        # proxy_cache_lock и stale-while-revalidate обязательны: без них TTL
        # истекает синхронно на всех edge-нодах и origin получает залп
        # (architecture.md §3).
        location ~ ^/api/polls/[^/]+/results$ {
            proxy_pass http://api;
            proxy_cache results;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_valid 200 5s;
            proxy_cache_valid 404 425 1s;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location /api/ {
            proxy_pass http://api;
        }

        location = /healthz {
            proxy_pass http://api;
        }
    }
}
